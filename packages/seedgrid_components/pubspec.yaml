name: seedgrid_components
description: "Componentes SeedGrid para Flutter (porte familiar dos componentes React)."
version: 2026.7.1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.10.4
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  seedgrid_theme:
    path: ../seedgrid_theme
  seedgrid_commons:
    path: ../seedgrid_commons
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  flutter_quill: ^11.5.0
  html: ^0.15.4
  file_picker: ^11.0.3
  desktop_drop: ^0.7.0
  camera: ^0.12.0+2
  web: ^1.1.0
  # SDK do SeedGrid Pulse (cliente do SgRealtimeProvider e do SgNotificationBell). Por git, com tag fixa, ate os componentes
  # serem bem testados e o pacote ir ao pub.dev (publish_to: none permite dependencia git).
  seedgrid_pulse_subscriber:
    git:
      url: https://github.com/SeedGrid/seedgrid-pulse-sdk.git
      path: components/subscribers/seedgrid-pulse-subscriber-flutter
      ref: flutter-subscriber-v2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
